<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D5EAF">
    <meta name="description" content="An exploratory atlas of village dance traditions across Greece and Asia Minor.">
    <title>National Ministry of Greek Folk Dance Research Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Gloock&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#archive-panel">Skip to archive</a>
    <div class="app-shell">
      <header class="site-header">
        <div class="brand">
          <button class="brand-mark brand-home-button" id="home-button" type="button" aria-label="Reset map">logo here</button>
          <h1 class="brand-name">National Ministry of Greek Folk Dance Research Map</h1>
        </div>
        <div class="language-options" id="language-options" role="group" aria-label="Display language">
          <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">English</button>
          <button class="language-button" type="button" data-language="el" lang="el" aria-pressed="false">Ελληνικά</button>
        </div>
      </header>

      <main class="atlas">
        <section class="map-stage" aria-label="Interactive dance map">
          <div id="map"></div>
          <div class="map-wash" aria-hidden="true"></div>

          <button class="mobile-archive-button" id="mobile-archive-button" type="button" aria-controls="archive-panel" aria-expanded="false">
            Open archive <span id="mobile-count">00</span>
          </button>

          <button class="desktop-archive-toggle" id="desktop-archive-toggle" type="button" aria-controls="archive-panel" aria-expanded="true" aria-label="Collapse village archive">
            <span aria-hidden="true">›</span>
          </button>
        </section>

        <aside class="archive-panel" id="archive-panel" aria-label="Village archive" tabindex="-1">
          <div class="panel-header">
            <div>
              <h2 id="panel-title" hidden>Village archive</h2>
            </div>
            <button class="panel-close" id="panel-close" type="button" aria-label="Close archive">×</button>
          </div>

          <div class="search-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
            <label class="sr-only" for="village-search">Search villages</label>
            <input id="village-search" type="search" placeholder="Search villages or dances" autocomplete="off">
          </div>

          <div class="panel-scroll">
            <div id="village-list" class="archive-tree" aria-live="polite">
              <p class="loading-state">Reading content/dances.md…</p>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
