# Replace map.example.org before enabling this site.
# Certbot adds the HTTPS server and redirects after DNS points to the droplet.
server {
    listen 80;
    server_name map.example.org;
    client_max_body_size 384k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    # Express serves only the allowed static paths and handles PMTiles Range requests.
    # Proxy all paths so each Node process serves its own complete release.
}
