services:
  app:
    image: ${GREECE_DANCE_IMAGE:?Run setup or the deployment service first}
    user: "${GREECE_DANCE_UID:?}:${GREECE_DANCE_GID:?}"
    read_only: true
    logging:
      driver: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keep the existing loopback-only Nginx connection, including legacy rollback.
    network_mode: host
    # Node reads secrets inside the container; Compose never expands them into argv.
    command: ["node", "--env-file=/etc/greece-dance/app.env", "server/index.js"]
    environment:
      HOST: 127.0.0.1
      PORT: "${GREECE_DANCE_PORT:-8000}"
      LIVE_INFO_DIR: /var/lib/greece-dance-content
      BASEMAP_DIR: /var/lib/greece-dance-basemaps/versions
      MAP_CACHE_DIR: /var/lib/greece-dance-tile-cache
    volumes:
      # Shared SELinux labels: the updater and app use these mounts concurrently.
      - ${GREECE_DANCE_CONFIG_DIR:-/etc/greece-dance}:/etc/greece-dance:ro,z
      - ${GREECE_DANCE_STATE_DIR:-/var/lib/greece-dance-editor}:/var/lib/greece-dance-editor:rw,z
      - ${GREECE_DANCE_CONTENT_DIR:-/var/lib/greece-dance-content}:/var/lib/greece-dance-content:rw,z
      - ${GREECE_DANCE_BASEMAP_ROOT:-/var/lib/greece-dance-basemaps}/versions:/var/lib/greece-dance-basemaps/versions:ro,z
      - ${GREECE_DANCE_MAP_CACHE_DIR:-/var/lib/greece-dance-tile-cache}:/var/lib/greece-dance-tile-cache:rw,z
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    stop_grace_period: 15s
